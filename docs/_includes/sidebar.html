<nav class="site-sidebar">
  <div class="sidebar-title">
    <a href="{{ '/' | relative_url }}">PLmicRO<br>Journal Club</a>
  </div>
  <ul class="sidebar-nav">
    {% for path in site.header_pages %}
      {% assign my_page = site.pages | where: "path", path | first %}
      {% if my_page.title %}
        <li>
          <a class="sidebar-link{% if page.url == my_page.url %} active{% endif %}" href="{{ my_page.url | relative_url }}">{{ my_page.title }}</a>
        </li>
      {% endif %}
    {% endfor %}

    <!-- Topic Primers (expandable) -->
    <li class="sidebar-group">
      <details{% if page.url contains '/ai-intro' or page.url contains '/primers/' %} open{% endif %}>
        <summary class="sidebar-link sidebar-group-toggle">Topic Primers</summary>
        <ul class="sidebar-subnav">
          <li><a class="sidebar-link sidebar-sublink{% if page.url == '/PLmicRO/ai-intro/llms/' %} active{% endif %}" href="{{ '/ai-intro/llms/' | relative_url }}">AI, LLMs & Agents</a></li>
          <li><a class="sidebar-link sidebar-sublink{% if page.url == '/PLmicRO/primers/detection-performance/' %} active{% endif %}" href="{{ '/primers/detection-performance/' | relative_url }}">Detection Performance</a></li>
        </ul>
      </details>
    </li>
  </ul>
</nav>
