name: Add Paper to Reading List

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to add'
        required: true
        type: number

jobs:
  add-paper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Fetch issue details
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue_number }}
            });
            
            // Extract title and body
            const title = issue.data.title.replace(/^\[Paper Suggestion\]\s*/i, '');
            const body = issue.data.body || '';
            
            // Parse DOI, Authors from issue body (assuming format from template)
            const doiMatch = body.match(/\*\*DOI[:\s]+\*\*\s*(.+?)$/m);
            const authorsMatch = body.match(/\*\*Authors[:\s]+\*\*\s*(.+?)$/m);
            
            const doi = doiMatch ? doiMatch[1].trim() : '';
            const authors = authorsMatch ? authorsMatch[1].trim() : '';
            
            // Format paper entry
            let paperEntry = title;
            if (authors) paperEntry = `${authors} — ${paperEntry}`;
            if (doi) paperEntry = `${paperEntry} (${doi})`;
            
            core.setOutput('paper', paperEntry);
            core.setOutput('issue_number', issue.data.number);
      
      - name: Get next session number
        id: session
        run: |
          # Find the highest session number in reading_list.md
          max_session=$(grep -oP '^\d+' reading_list.md | sort -n | tail -1)
          next_session=$((max_session + 1))
          echo "next=$next_session" >> $GITHUB_OUTPUT
      
      - name: Add paper to reading list
        run: |
          # Append new row to reading_list.md
          echo "${{ steps.session.outputs.next }}TBD${{ steps.issue.outputs.paper }}- [ ] Read" >> reading_list.md
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reading_list.md
          git commit -m "Add paper from issue #${{ steps.issue.outputs.issue_number }}"
          git push
      
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue_number }},
              state: 'closed'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue_number }},
              body: '✅ Added to [reading list](https://hrydbeck.github.io/PLmicRO/reading-list/) as Session ${{ steps.session.outputs.next }}'
            });
